# ============================================================
# jsonSQLDB - Bloqueos para nginx
#
# Equivalente a los .htaccess (Apache) y web.config (IIS) que trae el
# proyecto. nginx NO lee esos ficheros, así que sin estas reglas las
# carpetas data/, logs/ y engine/ quedan accesibles desde el navegador
# y cualquiera puede descargarse tus bases de datos enteras.
#
# Cómo usarlo: ver LEEME.md en esta misma carpeta.
# ============================================================

# --- Nunca listar directorios ---
autoindex off;

# --- Carpetas internas: nada que ver aquí ---
# Datos, logs, motor, documentación, pruebas y los internos del panel.
location ~ ^/jsonsqldb/(data|logs|engine|docs|tests|nginx)/ {
    deny all;
    return 404;
}

location ~ ^/jsonsqldb/jsonsqldbadmin/(lib|vistas|datos)/ {
    deny all;
    return 404;
}

# --- Ficheros de configuración, en cualquier nivel ---
location ~ ^/jsonsqldb/.*(^|/)(config\.php|.*_config\.php|.*\.dist\.php)$ {
    deny all;
    return 404;
}

# --- Extensiones que nunca deben servirse ---
# .json es la extensión de los datos: bloquearla es lo más importante de
# todo este fichero. Los assets del panel son .css, .js y .woff2, así que
# no se ven afectados.
location ~ ^/jsonsqldb/.*\.(json|md|log|lock|cache|tmp|dist|sample|bak|old|inc|ini|sql|crt|pem|key)$ {
    deny all;
    return 404;
}

# --- Ficheros ocultos (.htaccess, .git, .env...) ---
location ~ ^/jsonsqldb/.*/\. {
    deny all;
    return 404;
}

# --- Lo único que se sirve: el endpoint de la API y el panel ---
# Ajusta la versión de PHP-FPM a la que tengas instalada.
location ~ ^/jsonsqldb/(api/jsonsqldb_api\.php|jsonsqldbadmin/index\.php)$ {
    include        fastcgi_params;
    fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

    # Subidas de SQL largas: por encima de MAX_POST_SIZE de la API no hace falta
    client_max_body_size 1m;

    # Consultas pesadas: súbelo si trabajas con tablas grandes
    fastcgi_read_timeout 300;
}

# --- Assets del panel: estáticos, sin pasar por PHP ---
location ~ ^/jsonsqldb/jsonsqldbadmin/assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# --- Cualquier otro .php del proyecto no se ejecuta ---
# El cliente de ejemplo, las pruebas y el motor no son puntos de entrada.
location ~ ^/jsonsqldb/.*\.php$ {
    deny all;
    return 404;
}
