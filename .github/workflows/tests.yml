name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo imprescindible: el workflow solo lee el código y ejecuta pruebas.
# Sin esto, el GITHUB_TOKEN hereda los permisos del repositorio, que en
# repositorios antiguos son de escritura.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, zip
          coverage: none

      - name: Create configuration
        # configurar.php genera claves al azar y las hace coincidir entre panel
        # y API. Copiar los .dist a secas dejaba las claves de ejemplo, que están
        # publicadas en el repositorio y ahora impiden arrancar a propósito.
        run: php configurar.php --local

      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Engine and API
        run: |
          php tests/f1_nucleo.php
          php tests/f2_parser.php
          php tests/f2_select.php
          php tests/f3_escrituras.php
          php tests/f4_api.php
          php tests/f5_esquema.php

      - name: Admin panel
        run: php tests/f5_admin.php

      - name: Crash recovery
        run: php tests/f6_cortes.php

      - name: Concurrency
        run: php tests/f7_concurrencia.php

      - name: Indexes
        run: php tests/f8_indices.php

      - name: Journal
        run: php tests/f9_journal.php

      - name: Incremental indexes
        run: php tests/f10_indices_incrementales.php
